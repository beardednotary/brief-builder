name = "briefbuilder-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Per-IP throttle: 10 statement requests per minute.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# The Anthropic key is NOT stored here. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
