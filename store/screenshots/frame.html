<!doctype html>
<!--
  One App Store screenshot. render.ps1 opens this headless at the target
  size with ?n=<slide number>; it shows raw/<n>.png inside a device frame
  under the slide's headline. Open it in a browser with ?n=1 to preview.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>BriefBuilder screenshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --navy: #011D58;
    --navy-light: #0E3A9A;
    --navy-deep: #000F33;
    --gold: #FDBB17;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    font-family: Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;
    color: #fff;
    background: radial-gradient(130vw 110vw at 50% -10%, var(--navy-light) 0%, var(--navy) 52%, var(--navy-deep) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .text { flex: none; padding: 10vw 7vw 0; text-align: center; }
  .kicker {
    color: var(--gold);
    font-weight: 800;
    font-size: 3.3vw;
    letter-spacing: 0.55vw;
    text-transform: uppercase;
    margin-bottom: 3vw;
  }
  h1 { font-weight: 900; font-size: 8.4vw; line-height: 1.08; letter-spacing: -0.12vw; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--gold); }
  .sub {
    margin: 3.2vw auto 0;
    max-width: 78vw;
    font-size: 4vw;
    line-height: 1.38;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    text-wrap: balance;
  }
  .shot {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    padding: 7vw 0 7vw;
  }
  .device {
    height: 100%;
    padding: 1.5vw;
    border-radius: 9vw;
    background: #0A1020;
    box-shadow:
      0 0 0 0.35vw rgba(255, 255, 255, 0.14),
      0 4vw 10vw rgba(0, 0, 0, 0.55);
  }
  .device img, .placeholder {
    display: block;
    height: 100%;
    width: auto;
    border-radius: 7.6vw;
  }
  .placeholder {
    aspect-ratio: 1206 / 2622;
    background: repeating-linear-gradient(45deg, #1b2a52 0 2vw, #16244a 2vw 4vw);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 3.6vw;
    font-weight: 700;
    padding: 6vw;
  }
</style>
</head>
<body>
  <div class="text">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="shot">
    <div class="device" id="device"></div>
  </div>

<script>
  // Order and wording match store/listing.md. *text* renders in gold.
  const SLIDES = {
    1: {
      kicker: 'Statement Writer',
      title: 'AI writes your *EPB statements*',
      sub: 'Two options from every entry: action first, then impact.',
    },
    2: {
      kicker: 'Log as you go',
      title: 'Log it in *30 seconds*',
      sub: 'Capture the win the day it happens, numbers and all.',
    },
    3: {
      kicker: 'EPB Builder',
      title: 'All four blocks, *350 characters* each',
      sub: 'Live counts keep every block inside the limit.',
    },
    4: {
      kicker: 'Dashboard',
      title: 'Know where your *EPB stands*',
      sub: 'Progress by block and a countdown to your close-out date.',
    },
    5: {
      kicker: 'Plain language',
      title: 'Action and impact, *no fluff*',
      sub: 'Real numbers, no clichés, ready to paste into myEval.',
    },
    6: {
      kicker: 'Refer a friend',
      title: 'Give a friend a *free month*',
      sub: 'And earn a month of Pro when they write their first statement.',
    },
  };

  const n = new URLSearchParams(location.search).get('n') || '1';
  const slide = SLIDES[n] || SLIDES[1];

  const escape = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('kicker').textContent = slide.kicker;
  document.getElementById('title').innerHTML = escape(slide.title).replace(/\*(.+?)\*/g, '<em>$1</em>');
  document.getElementById('sub').textContent = slide.sub;

  const device = document.getElementById('device');
  const img = new Image();
  img.alt = '';
  img.onload = () => device.appendChild(img);
  img.onerror = () => {
    const missing = document.createElement('div');
    missing.className = 'placeholder';
    missing.textContent = 'Add raw/' + n + '.png';
    device.appendChild(missing);
  };
  img.src = 'raw/' + n + '.png';
</script>
</body>
</html>
